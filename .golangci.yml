version: "2"

linters:
  default: standard
  enable:
    - misspell
  settings:
    errcheck:
      exclude-functions:
        # writing to in-memory builders, usage output and HTTP response
        # encoders cannot usefully fail here
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*encoding/json.Encoder).Encode

run:
  timeout: 5m
